<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4">Create Account</h2>
          
          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
          
          <div class="form-group mb-3">
            <label>Email</label>
            <input type="email" class="form-control" [(ngModel)]="email" placeholder="your@email.com">
          </div>
          
          <div class="form-group mb-3">
            <label>Password</label>
            <input type="password" class="form-control" [(ngModel)]="password" placeholder="••••••••">
          </div>
          
          <div class="form-group mb-3">
            <label>Confirm Password</label>
            <input type="password" class="form-control" [(ngModel)]="confirmPassword" placeholder="••••••••">
          </div>
          
          <button class="btn btn-success btn-block w-100" (click)="register()">Register</button>
          
          <hr>
          
          <p class="text-center">
            Already have an account? <a href="/auth/login">Login here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
